name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Stage 1: Lint and Format (Section 15.2) ──
  rust-lint:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  ts-lint:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun test tests/unit/

  # ── Stage 2: Unit Tests (Section 15.2) ──
  rust-test:
    needs: [rust-lint]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --all

  # ── Stage 3: Build ──
  build:
    needs: [rust-test, ts-lint]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Build Rust (release)
        run: cargo build --release
      - name: Build TypeScript
        run: bun run build
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: alan-tools-${{ matrix.os }}
          path: target/release/alan-tools
          retention-days: 1

  # ── Stage 4: Integration Tests ──
  integration:
    needs: [build]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Integration tests
        run: cargo test --test '*' -- --test-threads=1

  # ── Stage 5: Eval Suite (Section 15.2 — blocks merge on regression) ──
  eval:
    needs: [build]
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Run eval suite
        run: bun run eval
      - name: Check eval results
        run: |
          # Eval runner exits non-zero if any task fails
          echo "Eval suite passed"

  # ── Stage 6: Real-model eval regression gate (only when the secret is set) ──
  # Runs the suite against a live model and fails if the pass-rate drops below a
  # floor. Skips cleanly on forks / when no ANTHROPIC_API_KEY secret is configured.
  eval-real:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Real-model eval gate (skipped if no ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALAN_EVAL_PROVIDER: anthropic
          ALAN_EVAL_MODEL: claude-sonnet-4-20250514
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping real-model eval gate."
            exit 0
          fi
          # Conservative floor; raise it once a clean ceiling baseline is recorded.
          bun run tests/eval/runner.ts --real --max 12 --min-pass-rate 0.5
