name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full real-model eval (the capability anchor). Mock evals gate
    # every PR; this catches drift that only shows against a live provider.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A force-push supersedes the previous run — don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Billing note (private repo): macOS runners bill at 10x, Windows at 2x,
# Linux at 1x. PRs therefore run the ubuntu+windows matrix; pushes to main
# and the nightly schedule run the full three-OS matrix. Coverage is the
# same before anything ships — it just lands at merge time, not per push.

jobs:
  # ── Stage 1: Lint and Format (Section 15.2) ──
  rust-lint:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  ts-lint:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun test tests/unit/
      - name: Repo-wide format check
        run: bun run format:check
      - name: Dependency audit (fails on known vulnerabilities)
        run: bun audit

  # ── Stage 2: Unit Tests (Section 15.2) ──
  rust-test:
    needs: [rust-lint]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --all

  # ── Stage 3: Build ──
  build:
    needs: [rust-test, ts-lint]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Build Rust (release)
        run: cargo build --release
      - name: Build TypeScript
        run: bun run build
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: gear-tools-${{ matrix.os }}
          path: target/release/gear-tools*
          retention-days: 1

  # ── Stage 4: Integration Tests ──
  integration:
    needs: [build]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Integration tests
        # cargo errors on an explicit --test '*' glob when zero targets match
        # (unlike plain `cargo test`, which no-ops cleanly) — guard until the
        # first crates/*/tests/*.rs file lands.
        run: |
          if compgen -G "crates/*/tests/*.rs" > /dev/null; then
            cargo test --test '*' -- --test-threads=1
          else
            echo "No crate-level integration tests (crates/*/tests/*.rs) yet — skipping."
          fi
      - name: TypeScript integration tests (real engine + real gear-tools)
        env:
          GEAR_TOOLS_BIN: ${{ github.workspace }}/target/release/gear-tools
        run: bun test tests/integration/

  # ── Stage 4b: Windows TypeScript typecheck ──
  # Unit-test enablement on Windows is tracked separately; typecheck is the
  # honest first gate (the suite has POSIX-shell assumptions to burn down).
  ts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  # ── Stage 4c: Packaged-binary E2E — the artifact users actually download ──
  packaged-e2e:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p gear-tools
      - name: Compile standalone CLI (same command as release builds)
        run: bun build --compile packages/orchestrator/src/bin/gear-cli.ts --outfile ./gear-packaged
      - name: Packaged smoke — version, help, REAL tool execution
        env:
          GEAR_TOOLS_BIN: ${{ github.workspace }}/target/release/gear-tools
        run: |
          ./gear-packaged --version | grep -E "Gear v[0-9]"
          ./gear-packaged --help > /dev/null
          # The artifact pair must actually work, not merely start: a
          # write → read → edit → bash round-trip through gear-tools.
          ./gear-packaged tools-smoke

  # ── Stage 4d: Desktop app (developer preview — must keep compiling) ──
  # Runs on Linux (1x billing vs macOS 10x); the macOS bundle itself is
  # exercised by developers locally and by release-time builds.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: oven-sh/setup-bun@v2
      - name: Tauri system deps (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p gear-tools
      - name: Frontend typecheck + build
        run: bun run --filter @gear/desktop build
      - name: Stage the engine sidecar
        # `cargo check` fails without it: externalBin is not optional at build
        # time, and a bundled app runs `gear engine-host` rather than Bun.
        run: bash scripts/stage-desktop-sidecar.sh
      - name: Tauri shell compiles
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Desktop reducers, launcher, review workspace
        env:
          GEAR_TOOLS_BIN: ${{ github.workspace }}/target/release/gear-tools
        run: bun test tests/unit/desktop tests/unit/brand-checklist.test.ts
      - name: No shadows in the built CSS
        # The brand's fingerprint, checked on the ARTIFACT rather than the
        # source: a shadow that arrives through a dependency still counts.
        run: |
          test "$(grep -c 'box-shadow' apps/desktop/dist/assets/*.css)" = "0"
      - name: gear desktop --check (headless engine handshake)
        env:
          GEAR_TOOLS_BIN: ${{ github.workspace }}/target/release/gear-tools
        run: bun packages/orchestrator/src/bin/gear-cli.ts desktop --check
      - name: Browser smoke — gear web, mock provider
        env:
          GEAR_TOOLS_BIN: ${{ github.workspace }}/target/release/gear-tools
        run: |
          bun x --bun playwright install --with-deps chromium
          bun run --cwd tests/e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: tests/e2e/test-results
          retention-days: 7

  # ── Stage 4e: Script + Rust supply-chain hygiene ──
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck installer + release scripts
        # info-level findings (SC2016 single-quoted PATH instructions, SC2015
        # deliberate fallbacks) are intentional; warnings and up gate.
        run: shellcheck --severity=warning scripts/*.sh

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Rust dependency audit
        run: cargo audit

  # ── Stage 5: Eval Suite (Section 15.2 — blocks merge on regression) ──
  eval:
    needs: [build]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Run eval suite (regression-gated vs committed mock baseline)
        # --compare fails the job if any task that passes in baseline-mock.json
        # fails now (mock runs are deterministic — zero noise band), on top of
        # the runner's own all-measured-tasks-pass gate.
        run: bun run eval -- --compare
      - name: Check eval results
        run: |
          # Eval runner exits non-zero if any task fails
          echo "Eval suite passed"

  # ── Stage 6: Real-model eval regression gate (only when the secret is set) ──
  # Runs the suite against a live model and fails if the pass-rate drops below a
  # floor. Skips cleanly on forks / when no ANTHROPIC_API_KEY secret is configured.
  eval-real:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Real-model eval gate (skipped if no ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEAR_EVAL_PROVIDER: anthropic
          GEAR_EVAL_MODEL: claude-sonnet-4-20250514
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping real-model eval gate."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly: the FULL suite, gated against the committed real-model
            # baseline within a 5pt noise band (skips cleanly if the baseline
            # was recorded on a different model).
            bun run tests/eval/runner.ts --real --compare --noise 0.05 --min-pass-rate 0.5
          else
            # Per-PR smoke: small, cheap, conservative floor.
            bun run tests/eval/runner.ts --real --max 12 --min-pass-rate 0.5
          fi
      - name: Upload eval run archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-real-results-${{ github.run_id }}
          path: tests/eval/results/
          retention-days: 30
          if-no-files-found: ignore
