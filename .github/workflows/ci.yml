name: CI

on:
  push:
    # `pull_request.branches` filters the BASE branch, so a lane branch pushed
    # without a PR open against one of those bases used to run NOTHING — and a
    # lane exists precisely to be proved by CI before it is merged.
    branches: [main, "lane/**"]
  pull_request:
    branches: [main, gear/phase-0-stabilize, "lane/**"]
  schedule:
    # Nightly full real-model eval (the capability anchor). Mock evals gate
    # every PR; this catches drift that only shows against a live provider.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A force-push supersedes the previous run — don't pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Billing note (private repo): macOS runners bill at 10x, Windows at 2x,
# Linux at 1x. PRs therefore run the ubuntu+windows matrix; pushes to main
# and the nightly schedule run the full three-OS matrix. Coverage is the
# same before anything ships — it just lands at merge time, not per push.

jobs:
  # ── Stage 1: Lint and Format (Section 15.2) ──
  rust-lint:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  ts-lint:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun test tests/unit/
      - name: Repo-wide format check
        run: bun run format:check
      - name: Dependency audit (fails on known vulnerabilities)
        run: bun audit

  # ── Stage 2: Unit Tests (Section 15.2) ──
  rust-test:
    needs: [rust-lint]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --all

  # ── Stage 3: Build ──
  build:
    needs: [rust-test, ts-lint]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - name: Build Rust (release)
        run: cargo build --release
      - name: Build TypeScript
        run: bun run build
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: rune-tools-${{ matrix.os }}
          path: target/release/rune-tools*
          retention-days: 1

  # ── Stage 4: Integration Tests ──
  integration:
    needs: [build]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Integration tests
        # cargo errors on an explicit --test '*' glob when zero targets match
        # (unlike plain `cargo test`, which no-ops cleanly) — guard until the
        # first crates/*/tests/*.rs file lands.
        run: |
          if compgen -G "crates/*/tests/*.rs" > /dev/null; then
            cargo test --test '*' -- --test-threads=1
          else
            echo "No crate-level integration tests (crates/*/tests/*.rs) yet — skipping."
          fi
      - name: Verifier toolchain inventory (P10.4)
        # tests/integration/verifier-ecosystems.test.ts runs the commands the
        # verifier detects for Go, Python, Rust and the JVM. On a laptop a
        # missing toolchain is a clean skip; here it would be a hole in the gate,
        # so RUNE_VERIFIER_REQUIRE_TOOLCHAINS below turns a skip into a failure.
        # This step prints what the runner actually has, so a change to the
        # image is visible in the log rather than only in a red test.
        run: |
          go version || echo "go: MISSING"
          python3 --version || echo "python3: MISSING"
          javac -version || echo "javac: MISSING"
          cargo --version || echo "cargo: MISSING"
      - name: TypeScript integration tests (real engine + real rune-tools)
        env:
          RUNE_TOOLS_BIN: ${{ github.workspace }}/target/release/rune-tools
          # ubuntu ships Go, Python and Java; Rust comes from the toolchain step
          # above. macOS runners have no Go, so the requirement is linux-only.
          RUNE_VERIFIER_REQUIRE_TOOLCHAINS: ${{ matrix.os == 'ubuntu-latest' && 'go,python,rust,java' || '' }}
        run: bun test tests/integration/

  # ── Stage 4b: Windows unit suite + the Windows installer's only compiler ──
  # Until P10.2 this job typechecked and stopped, because the unit suite carried
  # POSIX-shell and POSIX-path assumptions. Those are burned down now: what is
  # genuinely POSIX-only (the OS sandbox backend, `sh`, file modes) skips with a
  # stated reason, and everything else runs. A typecheck cannot see a path key
  # that is built differently on Windows — that defect shipped for months under
  # a green ts-windows.
  ts-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        # The Windows runner takes 190s for a suite that takes 40s on a
        # developer's machine — five times slower on disk-bound work, which is
        # most of what building an Engine (SQLite, config, skills) does. At
        # bun's 5s default that is one second of real budget per test, and the
        # first green run had one case fail on the clock alone at 6.4s while
        # its identical siblings passed at 1.2s. Raised, not removed: a hung
        # test still fails, thirty seconds later.
        run: bun test tests/unit/ --timeout 30000
      # ── The session host transport, on the platform that could not dial it ──
      # `rune serve` spawns one engine host per session and talks to it over a
      # socket, and until P13.2 that socket was a unix domain socket on every
      # platform — which Windows cannot bind. It reached a release because the
      # only gate that ran it on Windows was packaged-e2e, behind a cargo build
      # and a `bun build --compile`; from source it costs seconds, so it runs
      # here too, early, where a Windows regression is cheapest to see.
      - name: rune serve --check (from source)
        shell: bash
        run: |
          set -euo pipefail
          export RUNE_HOME="$RUNNER_TEMP/rune-home-serve"
          mkdir -p "$RUNE_HOME"
          bun packages/orchestrator/src/bin/rune-cli.ts serve --check
      - name: PowerShell installer parses and passes PSScriptAnalyzer
        shell: pwsh
        run: |
          # The .ps1 is the only Windows install path, and it cannot be
          # syntax-checked on the machine it is usually written on. Windows CI
          # is where it gets a compiler.
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install.ps1 parses"
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction SilentlyContinue
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $found = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error
            $found | Format-Table -AutoSize
            if ($found) { exit 1 }
          }
      - name: install.ps1 -Uninstall is a clean no-op on a fresh machine
        shell: pwsh
        run: |
          # Exercises the parameter block, the PATH helpers and the uninstall
          # branch without needing a published release to exist.
          ./scripts/install.ps1 -Uninstall -InstallDir "$env:RUNNER_TEMP/rune-bin"

  # ── Stage 4c: Packaged-binary E2E — the artifact users actually download ──
  packaged-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["macos-latest","ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release -p rune-tools
      - name: Compile standalone CLI (same command as release builds)
        shell: bash
        run: |
          set -euo pipefail
          # The same version source release.yml and build-release.sh use, so
          # CI exercises the injection path rather than a second one.
          . scripts/version.sh
          v="$(rune_version)"
          echo "building as $v"
          out="./rune-packaged"
          [ "$RUNNER_OS" = "Windows" ] && out="./rune-packaged.exe"
          bun build --compile --define=RUNE_BUILD_VERSION="\"$v\"" \
            packages/orchestrator/src/bin/rune-cli.ts --outfile "$out"
          # The injection must actually reach the binary: a define that stops
          # working would otherwise show up first in a shipped release.
          "$out" --version | grep -F "Rune v$v"
      # Windows binaries have been built for months with nothing exercising
      # them at runtime — ci.yml typechecked and stopped there. The packaged
      # artifact now has to start, answer, and run real tools on Windows too.
      - name: Packaged smoke - version, help, REAL tool execution
        shell: bash
        env:
          RUNE_TOOLS_BIN_POSIX: ${{ github.workspace }}/target/release/rune-tools
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            out="./rune-packaged.exe"
            export RUNE_TOOLS_BIN="$GITHUB_WORKSPACE/target/release/rune-tools.exe"
          else
            out="./rune-packaged"
            export RUNE_TOOLS_BIN="$RUNE_TOOLS_BIN_POSIX"
          fi
          export RUNE_HOME="$RUNNER_TEMP/rune-home"
          mkdir -p "$RUNE_HOME"
          "$out" --version | grep -E "Rune v[0-9]"
          "$out" --help > /dev/null
          # The artifact pair must actually work, not merely start: a
          # write -> read -> edit -> bash round-trip through rune-tools.
          "$out" tools-smoke
          # And the path a user actually takes: a prompt in, an answer out,
          # against a mock provider that needs no credential.
          bun scripts/smoke-print.ts "$out"
      # ── The served engine, from the artifact (P10.9a) ──
      # `--version` proves it starts, `tools-smoke` proves the executor works,
      # `smoke-print` proves the CLI turn. This proves the binary can spawn its
      # own session hosts: one session over the websocket completing a turn,
      # and no host left behind — a defect invisible to every source-run gate.
      - name: Packaged smoke - the binary hosts a session
        shell: bash
        env:
          RUNE_TOOLS_BIN_POSIX: ${{ github.workspace }}/target/release/rune-tools
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            out="./rune-packaged.exe"
            export RUNE_TOOLS_BIN="$GITHUB_WORKSPACE/target/release/rune-tools.exe"
          else
            out="./rune-packaged"
            export RUNE_TOOLS_BIN="$RUNE_TOOLS_BIN_POSIX"
          fi
          export RUNE_HOME="$RUNNER_TEMP/rune-home-serve"
          mkdir -p "$RUNE_HOME"
          "$out" serve --check
          # And again over the WINDOWS transport, wherever this is running.
          # The Windows host transport (loopback TCP + a per-host token) was
          # reachable only from Windows until P13.2, which is exactly how it
          # shipped broken; forcing it here means a Linux runner proves it too,
          # and what stays Windows-only is whether Bun binds a loopback port.
          export RUNE_HOME="$RUNNER_TEMP/rune-home-serve-tcp"
          mkdir -p "$RUNE_HOME"
          RUNE_HOST_TRANSPORT=tcp "$out" serve --check

  # ── Stage 4e: Script + Rust supply-chain hygiene ──
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck installer + release scripts
        # info-level findings (SC2016 single-quoted PATH instructions, SC2015
        # deliberate fallbacks) are intentional; warnings and up gate.
        run: shellcheck --severity=warning scripts/*.sh

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Rust dependency audit
        run: cargo audit

  # ── Stage 5: Eval Suite (Section 15.2 — blocks merge on regression) ──
  eval:
    needs: [build]
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["macos-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Incident coverage (every recurring failure class has a regression eval)
        # Reads the committed class snapshot, never a database: a CI runner has
        # no ~/.rune/blackbox.db. Fails when an eval-able class that has fired
        # ≥3 times has neither a task nor a dated waiver — a failure that keeps
        # happening and is not in the suite will keep happening.
        run: bun run tests/eval/from-incidents.ts --check
      - name: Run eval suite (regression-gated vs committed mock baseline)
        # --compare fails the job if any task that passes in baseline-mock.json
        # fails now (mock runs are deterministic — zero noise band), on top of
        # the runner's own all-measured-tasks-pass gate.
        run: bun run eval -- --compare
      - name: Check eval results
        run: |
          # Eval runner exits non-zero if any task fails
          echo "Eval suite passed"
      - name: Auto-mode safety corpus, offline (mechanical layer + regression gate)
        # The 227-row corpus against a DEAD reviewer. This is the pass that can
        # run on every change — no key, no network, no quota — and it is the
        # regression guard for the 22-minute fail-closed outage: with no model
        # reachable at all, every mechanical block must still hold and every
        # mechanical allow must still run. --compare additionally fails the job
        # if the count of reviewer-only blocks caught with no model call drops,
        # which is what a breaker quietly ceasing to hold looks like.
        run: bun run eval:auto-safety -- --offline --compare

  # ── Stage 6: Real-model eval regression gate (only when the secret is set) ──
  # Runs the suite against a live model and fails if the pass-rate drops below a
  # floor. Skips cleanly on forks / when no ANTHROPIC_API_KEY secret is configured.
  eval-real:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: cargo build --release
      - run: bun run build
      - name: Real-model eval gate (skipped if no ANTHROPIC_API_KEY secret)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNE_EVAL_PROVIDER: anthropic
          RUNE_EVAL_MODEL: claude-sonnet-4-20250514
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret configured — skipping real-model eval gate."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Nightly: the FULL suite, gated against the committed real-model
            # baseline within a 5pt noise band (skips cleanly if the baseline
            # was recorded on a different model).
            bun run tests/eval/runner.ts --real --compare --noise 0.05 --min-pass-rate 0.5
          else
            # Per-PR smoke: small, cheap, conservative floor.
            bun run tests/eval/runner.ts --real --max 12 --min-pass-rate 0.5
          fi
      - name: Upload eval run archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-real-results-${{ github.run_id }}
          path: tests/eval/results/
          retention-days: 30
          if-no-files-found: ignore
