name: Desktop release

# Bundles Gear Desktop for macOS, Windows and Linux, and publishes the signed
# update manifest `tauri-plugin-updater` reads.
#
# It is a SEPARATE workflow from release.yml on purpose. That one owns the CLI
# and gear-tools; this one owns the app. Two release paths that touch one file
# is how two lanes discover they were editing the same job.
#
# Signing follows the pattern Phase 1 established in `.github/workflows/
# release.yml` (lane A, PR #4) and does not re-implement it: every signing step
# is GUARDED on its secret being present and prints why it skipped when it is
# not. An unsigned release is a worse product; a release workflow that fails
# because a certificate has not been bought yet is a worse repository. The
# secrets are the same ones Phase 1 names, plus the two the updater needs.
#
# Nothing here can be tested by the agent that wrote it: signing needs
# certificates it does not have, and notarization needs an Apple ID. What is
# testable — that the bundle builds, that the sidecar is staged, that the
# manifest is well-formed — runs on every matrix leg regardless.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the bundles to the release. Leave false for a build-only dry run."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.label }}
    strategy:
      # One platform's toolchain breaking must not hide whether the others
      # built. A failed leg is information, not a reason to stop.
      fail-fast: false
      matrix:
        include:
          - label: macOS (arm64)
            os: macos-latest
            triple: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (x64)
            os: macos-latest
            triple: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ""
          - label: Linux (x64)
            os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Tauri system deps (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - run: bun install --frozen-lockfile

      - name: Stage the engine sidecar
        # The bundled app runs `gear engine-host`, so a user needs no Bun and
        # no source checkout. One script computes the Tauri target-triple
        # filename on every platform; a `cp` per matrix leg would drift.
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: bash scripts/stage-desktop-sidecar.sh

      - name: Build the bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # ── macOS signing — guarded ──
          # Absent secrets leave these empty, and tauri-action ships an
          # unsigned bundle rather than failing. The guard job below says so
          # out loud, because a silently unsigned release is the failure this
          # pattern exists to prevent.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ── Windows Authenticode — guarded the same way ──
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PWD }}
          # ── The updater's own signature ──
          # Separate from code signing and REQUIRED for auto-update: the
          # manifest is verified against the pubkey compiled into the app.
          # Without it the bundle still builds; `latest.json` just has no
          # signature and no installed app will accept it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # The updater overlay is merged in ONLY when a signing key exists.
          # Tauri refuses to emit an updater artifact it cannot sign, so
          # enabling it unconditionally makes every unsigned build — including
          # CI's and every developer's — fail at the last step. Guarding the
          # artifact rather than the failure is the same rule as the
          # certificates above.
          args: >-
            ${{ matrix.args }}
            ${{ secrets.TAURI_UPDATER_PRIVATE_KEY != '' && '--config src-tauri/tauri.release.conf.json' || '' }}
          includeUpdaterJson: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY != '' }}
          # The release itself is created by the publish job below, so that one
          # place decides what a release contains.
          includeRelease: false
          includeDebug: false

      - name: Report what was produced, and how large
        shell: bash
        run: |
          set -euo pipefail
          dir=apps/desktop/src-tauri/target
          echo "### ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          # Every artifact with its size: the bundle budget is a number that
          # has to be visible on every build, not a claim in a document.
          find "$dir" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.sig' -o -name '*.tar.gz' \
            -o -name '*.zip' \) -not -path '*/deps/*' 2>/dev/null \
            | while read -r f; do
                printf -- '- `%s` — %s\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)" \
                  >> "$GITHUB_STEP_SUMMARY"
              done || true

      - name: Signing status (say it out loud)
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          UPDATER_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-*)
              [ -n "${MAC_CERT:-}" ] || echo "::warning::MACOS_CERTIFICATE not set — this .dmg is UNSIGNED and will hit Gatekeeper. See docs/release-desktop.md."
              ;;
            windows-*)
              [ -n "${WIN_CERT:-}" ] || echo "::warning::WINDOWS_CERTIFICATE not set — this .msi is UNSIGNED and SmartScreen will warn. See docs/release-desktop.md."
              ;;
          esac
          [ -n "${UPDATER_KEY:-}" ] || echo "::warning::TAURI_UPDATER_PRIVATE_KEY not set — latest.json is unsigned, so no installed app will accept this update. See docs/release-desktop.md."

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.triple }}
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/**/*.sig
            apps/desktop/src-tauri/target/**/release/bundle/**/*.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/**/*.zip
            apps/desktop/src-tauri/target/**/latest.json
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish bundles + update manifest
    needs: [bundle]
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: in
          merge-multiple: true

      - name: Merge the per-platform manifests into one latest.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find in -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp {} out/ \; 2>/dev/null || true

          # Each matrix leg emits its own latest.json with one platform in it.
          # The updater reads ONE document, so they are merged here rather than
          # in four places that could each be the last writer.
          python3 - <<'PY'
          import json, pathlib, os
          out = {"version": os.environ.get("GITHUB_REF_NAME", "0.0.0").lstrip("v"),
                 "notes": "See the release notes.",
                 "pub_date": None, "platforms": {}}
          import datetime
          out["pub_date"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          for p in pathlib.Path("in").rglob("latest.json"):
              try:
                  doc = json.loads(p.read_text())
              except Exception as e:
                  print(f"skipping unreadable {p}: {e}")
                  continue
              out["platforms"].update(doc.get("platforms", {}))
              if doc.get("version"):
                  out["version"] = doc["version"]
          pathlib.Path("out/latest.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          if not out["platforms"]:
              # Not a failure: an unsigned build produces no updater artifacts,
              # and that is a stated, guarded outcome rather than a broken run.
              print("::warning::latest.json lists no platforms — the updater key was absent, so no bundle was signed for update.")
          PY
          ls -la out/

      - name: Checksums beside the bundles
        shell: bash
        run: |
          set -euo pipefail
          cd out && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
