name: Containment & Install Smoke

# The Linux containment audit, moved off the founder's Docker Desktop (broken
# on the founder's machine, not repaired — see
# docs/program/guarantees-program-20260914.md, Phase 7 "Sandbox") and onto a
# runner where Docker just works. Same Dockerfile, same run-suite.sh, same
# --privileged flag the method has always used — see
# scripts/containment/Dockerfile for why that flag exists and why it is a
# property of the rig, not of Rune. Only WHERE this runs changed.
#
# scripts/containment/ is the tracked copy of a method that, until this
# workflow, lived only under .codex/audit-20260910/linux/ — untracked,
# reachable solely from whoever's machine last ran it by hand. See
# .codex/audit-20260910/handoff/ (phase-2c-report.md, fix/f1-report.md,
# verify/v1-report.md, verify/v4-report.md) for the audit trail this comes
# from, including the toolchain-root symlink finding (V1-4) that
# containment-linux now re-checks live on every push and pull request instead
# of never.
#
# Nothing in this file reads a secret or calls a model. A fork's PR gets the
# identical job with nothing withheld.

on:
  push:
    branches: [main, gear/phase-0-stabilize]
  pull_request:
    branches: [main, gear/phase-0-stabilize]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containment-linux:
    name: Linux containment audit (Docker, --privileged rig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Allow unprivileged user namespaces on the runner
        # Ubuntu 24.04 (ubuntu-latest) default-restricts these; the OUTER
        # `docker run --privileged` grants the container the capability, but
        # the INNER bubblewrap call still needs the host kernel's AppArmor
        # sysctl flipped — a privileged container shares the host kernel, it
        # is not a second VM. ci.yml's own `integration` job runs this same
        # line before a bare (non-Docker) bwrap call, for the same reason.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build the source tarball (git ls-files over the committed tree)
        run: git ls-files -z | tar --null -T - -cf scripts/containment/source.tar

      - name: Build the containment-audit image
        run: |
          set -euo pipefail
          TAG="rune-containment-audit:$(date -u +%Y%m%d)-${{ github.run_number }}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          docker build -f scripts/containment/Dockerfile -t "$TAG" scripts/containment

      - name: Run the containment audit (clippy, cargo test -p rune-sandbox, toolchain-visibility, bun integration)
        run: |
          set -euo pipefail
          docker run --privileged --rm "$IMAGE_TAG" | tee run-suite.log

      - name: Build the toolchain-root symlink probe image (layered on the audit image)
        run: |
          set -euo pipefail
          docker build -f scripts/containment/Dockerfile.probe \
            --build-arg BASE_IMAGE="$IMAGE_TAG" \
            -t "$IMAGE_TAG-probe" scripts/containment

      - name: Run the toolchain-root symlink probe (V1 finding 4)
        run: |
          set -euo pipefail
          docker run --privileged --rm "$IMAGE_TAG-probe" | tee probe.log

      - name: Upload containment audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-audit-logs-${{ github.run_id }}
          path: |
            run-suite.log
            probe.log
          retention-days: 30
          if-no-files-found: warn

  # Proves scripts/install.sh — the actual source-build path a stranger's
  # machine takes, not the pre-built-binary download release.yml's own
  # install-smoke job verifies post-tag. Bun and cargo come from the same
  # setup actions every other job here uses; nothing else is pre-installed.
  install-smoke:
    name: Clean-machine install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Compute the expected version (scripts/version.sh is the one source)
        run: echo "EXPECTED_VERSION=$(bash scripts/version.sh)" >> "$GITHUB_ENV"

      # The step below points HOME at a scratch directory so that ~/.rune is
      # genuinely empty. rustup, cargo and bun keep their state under the REAL
      # home (~/.rustup, ~/.cargo, ~/.bun), so without these three the installer
      # reached `cargo build` and rustup had no toolchain to choose — the first
      # hosted run of this job failed on both runners inside half a minute for
      # exactly that reason (2026-09-15). The toolchain homes are remembered here
      # and pinned in the scratch-home steps; only ~/.rune moves.
      - name: Remember where the toolchains live
        run: |
          echo "TOOLCHAIN_RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_BUN_INSTALL=${BUN_INSTALL:-$HOME/.bun}" >> "$GITHUB_ENV"

      - name: scripts/install.sh into a scratch home
        # A scratch $HOME with no pre-existing ~/.rune means install.sh's
        # cross-worktree / non-fast-forward guard (install.sh:~150-181) never
        # finds a rune-compiled.meta to compare against, so it never fires —
        # on a genuinely clean machine there is nothing for it to refuse.
        # That IS what "respecting" the guard means here, not
        # RUNE_ALLOW_NON_FF_INSTALL: that override exists to push PAST a
        # real conflict between worktrees and is never set below (see
        # MEMORY gear-install-path-case-guard: prefer the real guard over
        # the override even when it misfires, which this setup avoids
        # rather than needing).
        #
        # No rust-cache action on this job: a warmed cargo registry would
        # make this less of a clean-machine proof, not more, and the only
        # thing timed here is "does it install", not "how fast".
        env:
          HOME: ${{ runner.temp }}/rune-clean-home
          RUSTUP_HOME: ${{ env.TOOLCHAIN_RUSTUP_HOME }}
          CARGO_HOME: ${{ env.TOOLCHAIN_CARGO_HOME }}
          BUN_INSTALL: ${{ env.TOOLCHAIN_BUN_INSTALL }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          bash scripts/install.sh

      - name: rune --version matches the tree
        env:
          HOME: ${{ runner.temp }}/rune-clean-home
        run: |
          set -euo pipefail
          "$HOME/.rune/bin/rune" --version | tee rune-version.out
          grep -F "Rune v${EXPECTED_VERSION}" rune-version.out

      - name: rune doctor runs clean on a first-ever install
        env:
          HOME: ${{ runner.temp }}/rune-clean-home
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          "$HOME/.rune/bin/rune" doctor | tee rune-doctor.out
          grep -F "RUNE DOCTOR" rune-doctor.out
