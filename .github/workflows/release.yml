name: Release

# Tag-driven distribution: `git tag v0.3.0 && git push origin v0.3.0` builds a
# CLI + gear-tools pair for every supported platform, generates SHA256SUMS in
# the same job that assembled the binaries (checksum drift is impossible by
# construction), smoke-runs the Linux pair, publishes the GitHub release, and
# then re-installs from that release exactly the way the README tells users to.
#
# The version is not written down anywhere in this file. `scripts/version.sh`
# is the one source, `scripts/targets.sh` is the one target list, and the
# binary carries what it was built with (`bun build --define`). Publishing
# REFUSES when the tag and the binary's own `--version` disagree — the failure
# that used to ship silently, because four hand-maintained copies of the
# version had no way to notice each other.
#
# `workflow_dispatch` runs the whole pipeline WITHOUT publishing (a dry run),
# so the release path can be exercised on a branch before a tag exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as (e.g. 0.3.0). Defaults to the dev version from scripts/version.sh."
        required: false
        type: string
      publish:
        description: "Actually publish a release. Leave false for a dry run: build, checksum and smoke only."
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the published release as a prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A tag push is a real release; a manual run publishes only when asked.
  GEAR_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

jobs:
  version:
    name: Resolve the one version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          # A tag push names the version. A manual run may name one, else the
          # dev version scripts/version.sh computes. Either way, ONE source.
          if [ "${{ github.event_name }}" = "push" ]; then
            export GEAR_VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            export GEAR_VERSION="${{ inputs.version }}"
          fi
          v="$(bash scripts/version.sh)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=${GEAR_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Building as: $v (publish=${GEAR_PUBLISH})"

  cli:
    name: CLI (bun cross-compile, all platforms)
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compile standalone CLIs
        shell: bash
        env:
          GEAR_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # One target list, one version source — the same files the local
          # scripts/build-release.sh reads, so a local build and a release
          # build cannot cover different platforms.
          . scripts/targets.sh
          . scripts/version.sh
          v="$(gear_version)"
          mkdir -p out
          for pair in "${GEAR_TARGETS[@]}"; do
            target="${pair%%:*}"; suffix="${pair##*:}"
            bun build --compile --minify --target="$target" \
              --define=GEAR_BUILD_VERSION="\"$v\"" \
              packages/orchestrator/src/bin/gear-cli.ts --outfile "out/gear-$suffix"
          done
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/gear-*
          retention-days: 7

  tools-native:
    name: ${{ matrix.asset }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            asset: gear-tools-darwin-arm64
            bin: gear-tools
          - os: macos-13
            asset: gear-tools-darwin-x64
            bin: gear-tools
          - os: ubuntu-latest
            asset: gear-tools-linux-x64
            bin: gear-tools
          - os: windows-latest
            asset: gear-tools-windows-x64.exe
            bin: gear-tools.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gear-tools
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          cp "target/release/${{ matrix.bin }}" "out/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*
          retention-days: 7

  tools-linux-arm64:
    name: gear-tools-linux-arm64 (cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - run: cross build --release -p gear-tools --target aarch64-unknown-linux-gnu
      - name: Stage asset
        run: |
          mkdir -p out
          cp target/aarch64-unknown-linux-gnu/release/gear-tools out/gear-tools-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: gear-tools-linux-arm64
          path: out/*
          retention-days: 7

  publish:
    name: Checksum, smoke, publish
    needs: [version, cli, tools-native, tools-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every target the one list names is present
        shell: bash
        run: |
          set -euo pipefail
          . scripts/targets.sh
          missing=0
          for pair in "${GEAR_TARGETS[@]}"; do
            f="dist/gear-${pair##*:}"
            [ -f "$f" ] || { echo "::error::missing CLI asset $f"; missing=1; }
          done
          for suffix in "${GEAR_TOOLS_ASSETS[@]}"; do
            f="dist/gear-tools-$suffix"
            [ -f "$f" ] || { echo "::error::missing tools asset $f"; missing=1; }
          done
          exit "$missing"
      - name: Checksums (generated beside the binaries they describe)
        run: |
          cd dist
          sha256sum gear-* > SHA256SUMS
          cat SHA256SUMS
      - name: Smoke the Linux pair end-to-end
        run: |
          chmod +x dist/gear-linux-x64 dist/gear-tools-linux-x64
          GEAR_TOOLS_BIN=dist/gear-tools-linux-x64 dist/gear-linux-x64 --version | grep -E "Gear v"
          # Not just "it starts": the pair must execute real tools together.
          GEAR_TOOLS_BIN="$PWD/dist/gear-tools-linux-x64" dist/gear-linux-x64 tools-smoke
      - name: The binary must agree with the tag
        shell: bash
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # `gear --version` prints "Gear v<version>". A release whose binary
          # disagrees with its tag is the exact failure four hand-maintained
          # version copies used to ship; it is now a hard stop.
          reported="$(dist/gear-linux-x64 --version | sed -n 's/^Gear v//p' | head -1)"
          echo "tag/input: $EXPECTED"
          echo "binary   : $reported"
          if [ "$reported" != "$EXPECTED" ]; then
            echo "::error::version mismatch — the tag says '$EXPECTED', the binary reports '$reported'. Refusing to publish."
            exit 1
          fi
      # ── Homebrew formula ──
      # Generated from the checksums this job just computed, so the formula and
      # the binaries it points at cannot drift. The founder copies it into the
      # tap repo (see docs/release.md); nothing here pushes to another repo.
      - name: Generate the Homebrew formula
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          sum() { grep -E "  $1\$" dist/SHA256SUMS | awk '{print $1}'; }
          cat > homebrew-tap/Formula/gear.rb <<RUBY
          # Generated by .github/workflows/release.yml. Do not edit by hand.
          class Gear < Formula
            desc "The agent that proves its work, on any model"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-darwin-arm64"
                sha256 "$(sum gear-darwin-arm64)"
                resource "gear-tools" do
                  url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-tools-darwin-arm64"
                  sha256 "$(sum gear-tools-darwin-arm64)"
                end
              end
              on_intel do
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-darwin-x64"
                sha256 "$(sum gear-darwin-x64)"
                resource "gear-tools" do
                  url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-tools-darwin-x64"
                  sha256 "$(sum gear-tools-darwin-x64)"
                end
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-linux-arm64"
                sha256 "$(sum gear-linux-arm64)"
                resource "gear-tools" do
                  url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-tools-linux-arm64"
                  sha256 "$(sum gear-tools-linux-arm64)"
                end
              end
              on_intel do
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-linux-x64"
                sha256 "$(sum gear-linux-x64)"
                resource "gear-tools" do
                  url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/gear-tools-linux-x64"
                  sha256 "$(sum gear-tools-linux-x64)"
                end
              end
            end

            def install
              # The CLI is useless without its native executor: file, search and
              # shell tools all run through gear-tools.
              bin.install stable.url.split("/").last => "gear"
              resource("gear-tools").stage do
                bin.install Dir["*"].first => "gear-tools"
              end
            end

            def caveats
              <<~EOS
                Gear reads GEAR_TOOLS_BIN, falling back to the gear-tools beside it.
                Check the install with:  gear doctor && gear tools-smoke
              EOS
            end

            test do
              assert_match "Gear v#{version}", shell_output("#{bin}/gear --version")
            end
          end
          RUBY
          cat homebrew-tap/Formula/gear.rb
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-tap
          path: homebrew-tap/**
          retention-days: 7

      - name: Publish release
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          PRERELEASE: ${{ inputs.prerelease == true && '--prerelease' || '' }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gear $TAG" \
            $PRERELEASE \
            --generate-notes
      - name: Dry run — built, checksummed and smoked, nothing published
        if: ${{ needs.version.outputs.publish != 'true' }}
        run: |
          echo "Dry run complete for ${{ needs.version.outputs.version }}."
          echo "Artifacts are attached to this workflow run; no GitHub release was created."
          ls -la dist/

  install-smoke:
    name: Fresh-machine install (README gh path, checksum-verified)
    needs: [version, publish]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Install exactly as the README instructs, then run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')"
          tmp="$(mktemp -d)"; cd "$tmp"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p "gear-$os-$arch" -p "gear-tools-$os-$arch" -p SHA256SUMS
          grep -E "gear(-tools)?-$os-$arch\$" SHA256SUMS | sha256sum -c -
          mkdir -p ~/.gear/bin
          install -m755 "gear-$os-$arch" ~/.gear/bin/gear
          install -m755 "gear-tools-$os-$arch" ~/.gear/bin/gear-tools
          export PATH="$HOME/.gear/bin:$PATH"
          gear --version | grep -E "Gear v"
          GEAR_TOOLS_BIN="$HOME/.gear/bin/gear-tools" gear tools-smoke
