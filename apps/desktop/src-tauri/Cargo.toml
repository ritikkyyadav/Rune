# Its own workspace root, deliberately.
#
# The repo root excludes this path, which works only while the nearest ancestor
# manifest IS the repo root. In a git worktree checked out under the main
# checkout, cargo walks up to the ORIGINAL root, whose exclude list does not
# match the worktree path, and every command fails with "believes it's in a
# workspace when it's not". An empty `[workspace]` stops the walk here.
[workspace]

[package]
name = "gear-desktop"
version = "0.3.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
