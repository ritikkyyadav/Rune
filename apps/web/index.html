<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E7E8E3" />
    <meta name="description" content="Gear — the agent that proves its work, on any model." />
    <!--
      Inter and IBM Plex Mono are the shipping faces; Söhne and Berkeley Mono
      are the licensed targets, and swapping them is a one-line change in
      packages/shared/src/design-tokens.ts. The stacks below carry a real
      fallback each, because the desktop runs offline and a font that never
      arrives must degrade to something chosen rather than to whatever the
      platform calls "sans-serif".
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Gear</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
