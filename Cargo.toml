[workspace]
resolver = "2"
members = [
    "crates/alan-sandbox",
    "crates/alan-index",
    "crates/alan-tools",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
authors = ["Ritik <ritik@savoirstudio.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error handling
thiserror = "2"
anyhow = "1"
# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# Database
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
# CLI
clap = { version = "4", features = ["derive"] }
# UUID
uuid = { version = "1", features = ["v7", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Hashing
sha2 = "0.10"
hex = "0.4"
# Async utilities
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tokio-stream = "0.1"
# Diff
similar = { version = "2", features = ["inline"] }
# Testing
tempfile = "3"
assert_cmd = "2"
predicates = "3"
# Directory traversal
walkdir = "2"
globset = "0.4"
# Config
toml = "0.8"
# Platform
dirs = "6"
# Regex
regex = "1"
