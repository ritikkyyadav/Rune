name: "Rune"
description: "Run Rune on a pull request and post one comment with the review and its audit."
author: "Savoir"
branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  prompt:
    description: >-
      What to ask Rune. Empty runs the default review prompt: read the diff,
      keep a plan ledger, and separate what was verified from what was only
      inspected.
    required: false
    default: ""
  gear:
    description: "Rune to run in — 1 guided, 2 workspace edits, 3 + sandboxed shell, 4 full autonomy."
    required: false
    default: "3"
  version:
    description: >-
      The Rune release to install (e.g. v0.3.0). Empty builds from the
      repository checked out at `source-path`, which is what this repo does
      because it IS the source.
    required: false
    default: ""
  source-path:
    description: "Path to a Rune checkout to build from when `version` is empty."
    required: false
    default: "."
  workspace:
    description: "The directory Rune works in."
    required: false
    default: "."
  pr:
    description: "Pull request number. Defaults to the one in the triggering event."
    required: false
    default: ""
  max-diff:
    description: "Characters of diff written to DIFF.patch before it is truncated."
    required: false
    default: "200000"
  dry-run:
    description: "Print the comment instead of posting it."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the comment. Needs `pull-requests: write`."
    required: false
    default: ${{ github.token }}

outputs:
  comment:
    description: "The comment body that was posted (or would have been, on a dry run)."
    value: ${{ steps.review.outputs.comment }}

runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    # A pinned release when one is named, and the checkout otherwise. The second
    # path is not a fallback for this repo — it is the normal case here, because
    # a repo reviewing its own pull requests should review them with the Rune in
    # the pull request, not with the last one that shipped.
    - name: Install Rune
      id: install
      shell: bash
      env:
        RUNE_VERSION: ${{ inputs.version }}
        RUNE_SOURCE: ${{ inputs.source-path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -n "${RUNE_VERSION}" ]; then
          echo "installing rune ${RUNE_VERSION}"
          gh release download "${RUNE_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "rune-*-$(uname -s | tr '[:upper:]' '[:lower:]')-*" \
            --dir "${RUNNER_TEMP}/rune"
          chmod +x "${RUNNER_TEMP}"/rune/rune-*
          mv "${RUNNER_TEMP}"/rune/rune-* "${RUNNER_TEMP}/rune/rune"
          echo "rune-cmd=${RUNNER_TEMP}/rune/rune" >> "$GITHUB_OUTPUT"
        else
          echo "building rune from ${RUNE_SOURCE}"
          ( cd "${RUNE_SOURCE}" && bun install --frozen-lockfile )
          # The native tool executor. Everything the agent does to a file or a
          # shell goes through it, so a review without it is a review that
          # cannot read the repository.
          ( cd "${RUNE_SOURCE}" && cargo build --release -p rune-tools )
          echo "RUNE_TOOLS_BIN=$(cd "${RUNE_SOURCE}" && pwd)/target/release/rune-tools" >> "$GITHUB_ENV"
          echo "rune-cmd=bun $(cd "${RUNE_SOURCE}" && pwd)/packages/orchestrator/src/bin/rune-cli.ts" >> "$GITHUB_OUTPUT"
        fi

    - name: Review
      id: review
      shell: bash
      env:
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_GEAR: ${{ inputs.gear }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_MAX_DIFF: ${{ inputs.max-diff }}
        INPUT_RUNE_CMD: ${{ steps.install.outputs.rune-cmd }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        args=(--workspace "${{ inputs.workspace }}")
        if [ "${{ inputs.dry-run }}" = "true" ]; then args+=(--dry-run); fi
        bun "${GITHUB_ACTION_PATH}/review.ts" "${args[@]}" | tee "${RUNNER_TEMP}/rune-comment.md"
        {
          echo "comment<<RUNE_EOF"
          cat "${RUNNER_TEMP}/rune-comment.md"
          echo "RUNE_EOF"
        } >> "$GITHUB_OUTPUT"
