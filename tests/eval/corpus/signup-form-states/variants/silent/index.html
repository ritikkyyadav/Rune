<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Join Fieldnotes Studio</title>
    <style>
      body {
        margin: 0;
        padding: 40px 16px;
        background: #f7f4ee;
        color: #1d1b18;
        font:
          16px/1.55 Georgia,
          serif;
      }
      input {
        display: block;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Join Fieldnotes Studio</h1>
    <form>
      <label for="email">Email</label>
      <input id="email" data-field="email" />
      <label for="password">Password</label>
      <input id="password" type="password" data-field="password" />
      <button type="submit">Create account</button>
    </form>
    <!-- TODO: confirmation field, validation, error and success states -->
  </body>
</html>
