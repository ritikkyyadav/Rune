<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldnotes Studio</title>
    <style>
      :root {
        --ink: #1d1b18;
        --paper: #f7f4ee;
        --line: #ddd6c9;
        --accent: #2f6b4f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.5 "Iowan Old Style",
          Georgia,
          serif;
      }
      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      h1 {
        font-size: clamp(28px, 4vw, 44px);
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      .summary {
        margin: 0 0 28px;
        color: #5c564d;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-end;
        margin-bottom: 24px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 220px;
      }
      label {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #6b655b;
      }
      input {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        width: 100%;
      }
      .filters {
        display: flex;
        gap: 8px;
      }
      .filters button {
        font: inherit;
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
      .filters button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .board {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }
      .card h2 {
        margin: 0;
        font-size: 20px;
      }
      .status {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .card p {
        margin: 0;
        color: #5c564d;
      }
      .fav {
        align-self: flex-start;
        margin-top: auto;
        font: inherit;
        font-size: 14px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .fav[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .empty {
        padding: 32px 0;
        color: #6b655b;
      }
      @media (max-width: 640px) {
        .shell {
          padding: 24px 16px 48px;
        }
        .board {
          grid-template-columns: 1fr;
        }
        .controls {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <h1>Fieldnotes Studio</h1>
      <p class="summary" id="summary">Loading projects…</p>
      <div class="controls">
        <div class="field">
          <label for="search">Search projects</label>
          <input id="search" type="search" placeholder="Kestrel, Northstar…" autocomplete="off" />
        </div>
        <div class="filters" role="group" aria-label="Filter by status">
          <button type="button" data-filter="All" aria-pressed="true">All</button>
          <button type="button" data-filter="Active" aria-pressed="false">Active</button>
          <button type="button" data-filter="Archived" aria-pressed="false">Archived</button>
        </div>
      </div>
      <div class="board" id="board"></div>
      <p class="empty" id="empty" hidden>No projects match this search.</p>
    </div>
    <script>
      const STORE = "fieldnotes:favorites";
      let projects = [];
      let filter = "All";
      let query = "";
      const favorites = new Set(readFavorites());

      function readFavorites() {
        try {
          const raw = window.localStorage.getItem(STORE);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }
      function saveFavorites() {
        try {
          window.localStorage.setItem(STORE, JSON.stringify([...favorites]));
        } catch {
          /* a private window is not an error worth showing */
        }
      }
      function visible() {
        const needle = query.trim().toLowerCase();
        return projects.filter((project) => {
          if (needle)
            return (project.name + " " + project.description).toLowerCase().includes(needle);
          return filter === "All" || project.status === filter;
        });
      }
      function render() {
        const board = document.getElementById("board");
        const rows = visible();
        board.replaceChildren(
          ...rows.map((project) => {
            const card = document.createElement("article");
            card.className = "card";
            card.dataset.projectId = project.id;

            const head = document.createElement("header");
            const name = document.createElement("h2");
            name.textContent = project.name;
            const status = document.createElement("span");
            status.className = "status";
            status.textContent = project.status;
            head.append(name, status);

            const description = document.createElement("p");
            description.textContent = project.description;

            const fav = document.createElement("button");
            fav.type = "button";
            fav.className = "fav";
            fav.setAttribute("aria-label", "Favorite " + project.name);
            const on = favorites.has(project.id);
            fav.setAttribute("aria-pressed", on ? "true" : "false");
            fav.textContent = on ? "Favorited" : "Favorite";
            fav.addEventListener("click", () => {
              if (favorites.has(project.id)) favorites.delete(project.id);
              else favorites.add(project.id);
              saveFavorites();
              render();
            });

            card.append(head, description, fav);
            return card;
          }),
        );
        document.getElementById("empty").hidden = rows.length > 0;
        const active = projects.filter((project) => project.status === "Active").length;
        document.getElementById("summary").textContent =
          projects.length + " projects · " + active + " active · " + favorites.size + " favorited";
      }
      document.getElementById("search").addEventListener("input", (event) => {
        query = event.target.value;
        render();
      });
      for (const button of document.querySelectorAll(".filters button")) {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          for (const other of document.querySelectorAll(".filters button"))
            other.setAttribute("aria-pressed", other === button ? "true" : "false");
          render();
        });
      }
      fetch("projects.json")
        .then((response) => response.json())
        .then((rows) => {
          projects = rows;
          render();
        })
        .catch(() => {
          document.getElementById("summary").textContent = "Projects could not be loaded.";
        });
    </script>
  </body>
</html>
